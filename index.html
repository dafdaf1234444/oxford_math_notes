<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxford Mathematics — Lecture Notes Hub</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/computer-modern/cmsans.css');
@import url('https://cdn.jsdelivr.net/npm/computer-modern/cmserif.css');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Computer Modern Serif", Georgia, serif;
  font-size: 15px;
  line-height: 1.5;
  color: #111;
  background: #f8f9fa;
  min-height: 100vh;
}
header {
  background: #1e293b;
  color: #fff;
  padding: 20px 32px;
  display: flex;
  align-items: baseline;
  gap: 16px;
}
header h1 { font-size: 20px; font-weight: 700; }
header .subtitle { font-size: 13px; color: #94a3b8; }

.main-layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: calc(100vh - 64px);
}

/* Left panel: course selection + filters */
.left-panel {
  background: #fff;
  border-right: 1px solid #e2e8f0;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.panel-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #64748b;
  margin-bottom: 6px;
}

/* Course cards */
.course-card {
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.course-card:hover { border-color: #93c5fd; }
.course-card.selected { border-color: #3b82f6; background: #eff6ff; }
.course-card .course-check {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 20px;
  height: 20px;
  border: 2px solid #d1d5db;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: transparent;
  transition: all 0.15s;
}
.course-card.selected .course-check {
  background: #3b82f6;
  border-color: #3b82f6;
  color: #fff;
}
.course-code {
  font-size: 14px;
  font-weight: 700;
  color: #1e40af;
}
.course-title {
  font-size: 13px;
  color: #374151;
  margin-top: 2px;
}
.course-meta {
  font-size: 11px;
  color: #6b7280;
  margin-top: 4px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.course-meta span {
  background: #f1f5f9;
  padding: 1px 6px;
  border-radius: 3px;
}
.course-actions {
  margin-top: 8px;
}
.course-actions a {
  font-size: 11px;
  color: #3b82f6;
  text-decoration: none;
  border: 1px solid #93c5fd;
  padding: 2px 8px;
  border-radius: 3px;
}
.course-actions a:hover { background: #dbeafe; }

/* Search */
#global-search {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
}
#global-search:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }

/* Type filters */
.type-filters {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.type-filter-btn {
  font-size: 10px;
  padding: 2px 7px;
  border: 1px solid #d1d5db;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  color: #4b5563;
  font-family: inherit;
}
.type-filter-btn:hover { background: #f3f4f6; }
.type-filter-btn.active { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }

/* Stats */
.stats-bar {
  font-size: 11px;
  color: #6b7280;
  padding: 4px 0;
  border-top: 1px solid #e5e7eb;
}

/* Right panel: combined glossary */
.right-panel {
  padding: 16px 24px;
  overflow-y: auto;
  max-height: calc(100vh - 64px);
}
.right-panel-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
}
.right-panel-header h2 { font-size: 16px; font-weight: 700; }
.overlap-badge {
  font-size: 10px;
  background: #fef3c7;
  color: #92400e;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 600;
}

/* Glossary entries */
.letter-group {
  margin-bottom: 12px;
}
.letter-head {
  font-size: 16px;
  font-weight: 700;
  color: #1e40af;
  padding: 4px 0;
  border-bottom: 2px solid #dbeafe;
  position: sticky;
  top: 0;
  background: #f8f9fa;
  z-index: 2;
}
.glossary-item {
  padding: 6px 0 6px 8px;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.glossary-item:hover { background: #f1f5f9; }
.glossary-item.overlap { background: #fefce8; }
.glossary-item.overlap:hover { background: #fef9c3; }
.glossary-item.filtered-out { display: none; }
.gi-type-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}
.gi-content { flex: 1; min-width: 0; }
.gi-name {
  font-weight: 600;
  color: #111;
  font-size: 13px;
}
.gi-refs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.gi-ref-badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
}
.gi-ref-badge.b21 { background: #dbeafe; color: #1e40af; }
.gi-ref-badge.b23 { background: #dcfce7; color: #166534; }
.gi-ref-badge.a11 { background: #f3e8ff; color: #6b21a8; }
.gi-ref-badge.a3 { background: #fef3c7; color: #92400e; }
.gi-ref-badge.a0 { background: #e0f2fe; color: #075985; }
.gi-ref-badge.a21 { background: #fce7f3; color: #9d174d; }
.gi-ref-badge:hover { opacity: 0.8; }
.gi-desc {
  font-size: 12px;
  color: #4b5563;
  margin-top: 2px;
  line-height: 1.4;
}
.gi-overlap-tag {
  font-size: 9px;
  background: #fde68a;
  color: #78350f;
  padding: 0 4px;
  border-radius: 2px;
  font-weight: 600;
  margin-left: 4px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #9ca3af;
}
.empty-state h3 { font-size: 16px; margin-bottom: 8px; }
.empty-state p { font-size: 13px; }

/* Responsive */
@media (max-width: 768px) {
  .main-layout { grid-template-columns: 1fr; }
  .left-panel { max-height: 300px; }
}
</style>
</head>
<body>

<header>

  <span class="subtitle">Interactive Viewers &amp; Cross-Course Glossary</span>

var TYPE_COLORS = {
  definition:'#93c5fd', theorem:'#fca5a5', lemma:'#86efac', proposition:'#d8b4fe',
  corollary:'#fdba74', example:'#d1d5db', remark:'#e5e7eb', notation:'#e5e7eb', warning:'#fde68a'
};
var TYPE_SHORT = {definition:'Def',theorem:'Thm',lemma:'Lem',proposition:'Prop',corollary:'Cor',example:'Ex',remark:'Rmk',notation:'Not',warning:'Warn'};

function getType(id) {
  if (id.indexOf('def-')===0) return 'definition';
  if (id.indexOf('thm-')===0) return 'theorem';
  if (id.indexOf('lem-')===0) return 'lemma';
  if (id.indexOf('prop-')===0) return 'proposition';
  if (id.indexOf('cor-')===0) return 'corollary';
  if (id.indexOf('ex-')===0) return 'example';
  if (id.indexOf('rmk-')===0) return 'remark';
  if (id.indexOf('not-')===0) return 'notation';
  if (id.indexOf('warn-')===0) return 'warning';
  return 'example';
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// State
var selectedCourses = { b21: true, b23: true, a11: true, a3: true, a0: true, a21: true };
var activeTypeFilter = 'all';

// Build overlap index: maps "courseKey:itemId" to overlap concept
var overlapIndex = {};
OVERLAPS.forEach(function(ov) {
  for (var ck in ov.items) {
    overlapIndex[ck + ':' + ov.items[ck]] = ov.concept;
  }
});

function renderCourseList() {
  var html = '';
  for (var ck in COURSES) {
    var c = COURSES[ck];
    var sel = selectedCourses[ck] ? ' selected' : '';
    html += '<div class="course-card' + sel + '" data-course="' + ck + '">';
    html += '<div class="course-check">\u2713</div>';
    html += '<div class="course-code">' + esc(c.code) + '</div>';
    html += '<div class="course-title">' + esc(c.title) + '</div>';
    html += '<div class="course-meta"><span>' + esc(c.term) + '</span><span>' + c.items + ' items</span><span>' + esc(c.instructor) + '</span></div>';
    html += '<div class="course-actions"><a href="' + c.path + '" target="_blank">Open Viewer \u2192</a></div>';
    html += '</div>';
  }
  document.getElementById('course-list').innerHTML = html;

  document.querySelectorAll('.course-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.tagName === 'A') return;
      var ck = card.getAttribute('data-course');
      selectedCourses[ck] = !selectedCourses[ck];
      renderCourseList();
      renderGlossary();
    });
  });
}

function renderTypeFilters() {
  var types = {};
  for (var ck in selectedCourses) {
    if (!selectedCourses[ck]) continue;
    for (var id in ENV[ck]) {
      var t = getType(id);
      types[t] = (types[t] || 0) + 1;
    }
  }
  var total = 0; for (var t in types) total += types[t];
  var order = ['definition','theorem','lemma','proposition','corollary','example','remark','notation','warning'];
  var html = '<button class="type-filter-btn' + (activeTypeFilter === 'all' ? ' active' : '') + '" data-type="all">All (' + total + ')</button>';
  order.forEach(function(t) {
    if (types[t]) html += '<button class="type-filter-btn' + (activeTypeFilter === t ? ' active' : '') + '" data-type="' + t + '">' + TYPE_SHORT[t] + ' (' + types[t] + ')</button>';
  });
  document.getElementById('type-filters').innerHTML = html;

  document.querySelectorAll('.type-filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      activeTypeFilter = btn.getAttribute('data-type');
      renderTypeFilters();
      applyFilters();
    });
  });
}

function renderGlossary() {
  var body = document.getElementById('glossary-body');
  renderTypeFilters();

  // Collect all items from selected courses
  var items = []; // { name, type, courseKey, itemId, searchText }
  for (var ck in selectedCourses) {
    if (!selectedCourses[ck]) continue;
    for (var id in ENV[ck]) {
      var name = ENV[ck][id];
      items.push({
        name: name,
        type: getType(id),
        courseKey: ck,
        itemId: id,
        overlap: overlapIndex[ck + ':' + id] || null
      });
    }
  }

  // Sort alphabetically by name
  items.sort(function(a, b) {
    return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
  });

  // Group by first letter
  var groups = {};
  items.forEach(function(it) {
    var letter = it.name.charAt(0).toUpperCase();
    if (!/[A-Z]/.test(letter)) letter = '#';
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(it);
  });

  // Count overlaps
  var overlapItems = items.filter(function(it) { return it.overlap; });
  var overlapEl = document.getElementById('overlap-count');
  if (overlapItems.length > 0) {
    overlapEl.textContent = overlapItems.length + ' shared concepts';
    overlapEl.style.display = '';
  } else {
    overlapEl.style.display = 'none';
  }

  var letters = Object.keys(groups).sort();
  var html = '';
  letters.forEach(function(letter) {
    html += '<div class="letter-group" data-letter="' + letter + '">';
    html += '<div class="letter-head">' + letter + '</div>';
    groups[letter].forEach(function(it) {
      var color = TYPE_COLORS[it.type] || '#e5e7eb';
      var c = COURSES[it.courseKey];
      var overlapClass = it.overlap ? ' overlap' : '';
      var searchText = (it.name + ' ' + it.itemId + ' ' + (it.overlap || '') + ' ' + c.code).toLowerCase();
      html += '<div class="glossary-item' + overlapClass + '" data-type="' + it.type + '" data-course="' + it.courseKey + '" data-search="' + esc(searchText) + '">';
      html += '<span class="gi-type-dot" style="background:' + color + '"></span>';
      html += '<div class="gi-content">';
      html += '<span class="gi-name">' + esc(it.name) + '</span>';
      if (it.overlap) html += '<span class="gi-overlap-tag">shared</span>';
      html += '<div class="gi-refs">';
      html += '<a class="gi-ref-badge ' + c.badgeClass + '" href="' + c.path + '#' + it.itemId + '" target="_blank">' + esc(c.code) + ' ' + esc(TYPE_SHORT[it.type] || '') + ' ' + esc(it.itemId.replace(/^[a-z]+-/, '')) + '</a>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  });

  if (items.length === 0) {
    html = '<div class="empty-state"><h3>No courses selected</h3><p>Select one or more courses from the left panel to see the combined glossary.</p></div>';
  }

  body.innerHTML = html;
  document.getElementById('stats-bar').textContent = items.length + ' terms across ' + Object.keys(selectedCourses).filter(function(k) { return selectedCourses[k]; }).length + ' course(s)';
  applyFilters();
}

function applyFilters() {
  var q = (document.getElementById('global-search').value || '').toLowerCase().trim();
  document.querySelectorAll('.glossary-item').forEach(function(item) {
    var matchType = activeTypeFilter === 'all' || item.getAttribute('data-type') === activeTypeFilter;
    var matchSearch = !q || (item.getAttribute('data-search') || '').indexOf(q) >= 0;
    if (matchType && matchSearch) item.classList.remove('filtered-out');
    else item.classList.add('filtered-out');
  });
  document.querySelectorAll('.letter-group').forEach(function(grp) {
    var visible = grp.querySelectorAll('.glossary-item:not(.filtered-out)').length > 0;
    grp.style.display = visible ? '' : 'none';
  });
}

// Init
renderCourseList();
renderGlossary();
document.getElementById('global-search').addEventListener('input', applyFilters);
</script>
